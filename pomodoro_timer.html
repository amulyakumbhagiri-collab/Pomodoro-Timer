<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomodoro Timer</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: #fce4ec;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 520px;
      background: white;
      padding: 40px 28px;
      text-align: center;
      border-radius: 18px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
    }
    h1 { color: #e91e63; margin-top: 0; }
    .buttons, .controls {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    h2 {
      font-size: clamp(56px, 12vw, 76px);
      margin: 30px 0;
      color: #333;
      font-variant-numeric: tabular-nums;
    }
    button {
      padding: 12px 18px;
      border: none;
      border-radius: 8px;
      background: #e91e63;
      color: white;
      cursor: pointer;
      font-size: 15px;
    }
    button:hover { background: #ad1457; }
    button:focus-visible { outline: 3px solid #880e4f; outline-offset: 3px; }
    .hint { color: #777; font-size: 14px; margin-bottom: 0; }
  </style>
</head>
<body>
  <main class="container">
    <h1>Pomodoro Timer</h1>

    <div class="buttons" aria-label="Choose timer mode">
      <button type="button" onclick="setTime(25)">Focus</button>
      <button type="button" onclick="setTime(5)">Short Break</button>
      <button type="button" onclick="setTime(15)">Long Break</button>
    </div>

    <h2 id="timer" role="timer" aria-live="off">25:00</h2>

    <div class="controls">
      <button type="button" onclick="startTimer()">Start</button>
      <button type="button" onclick="pauseTimer()">Pause</button>
      <button type="button" onclick="resetTimer()">Reset</button>
    </div>

    <p class="hint">Focus for 25 minutes, then take a break.</p>
  </main>

  <script>
    const FOCUS_MINUTES = 25;
    let selectedMinutes = FOCUS_MINUTES;
    let time = selectedMinutes * 60;
    let timer = null;

    function updateDisplay() {
      const minutes = Math.floor(time / 60);
      const seconds = time % 60;
      document.getElementById("timer").textContent =
        String(minutes).padStart(2, "0") + ":" +
        String(seconds).padStart(2, "0");
    }

    function startTimer() {
      if (timer !== null) return;

      timer = setInterval(function () {
        if (time > 0) {
          time--;
          updateDisplay();
        } else {
          clearInterval(timer);
          timer = null;
          alert("Time is up!");
        }
      }, 1000);
    }

    function pauseTimer() {
      clearInterval(timer);
      timer = null;
    }

    function resetTimer() {
      pauseTimer();
      time = selectedMinutes * 60;
      updateDisplay();
    }

    function setTime(minutes) {
      pauseTimer();
      selectedMinutes = minutes;
      time = selectedMinutes * 60;
      updateDisplay();
    }

    updateDisplay();
  </script>
</body>
</html>
